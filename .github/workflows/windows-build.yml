name: Windows MinGW dependency SDK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-mingw-sdk-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  SDK_ROOT: C:\KdenliveSDK
  CRAFT_BOOTSTRAP_REF: c26b14e905aeddb6a2b3fafa0a87349a7f46a52b

jobs:
  sdk:
    name: Build MinGW dependency SDK
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout Kdenlive fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap KDE Craft with MinGW x64
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          if (Test-Path $env:SDK_ROOT) {
            throw "SDK destination already exists: $env:SDK_ROOT"
          }

          $bootstrap = Join-Path $env:RUNNER_TEMP 'craft-bootstrap'

          git clone https://github.com/KDE/craft.git $bootstrap
          git -C $bootstrap checkout --detach $env:CRAFT_BOOTSTRAP_REF

          # CraftBootstrap.py currently defaults to MSVC when --use-defaults
          # is used on Windows.
          #
          # Kdenlive's Windows development documentation recommends MinGW,
          # so change only the unattended compiler default in this pinned
          # Craft revision.

          $bootstrapPy = Join-Path $bootstrap 'setup\CraftBootstrap.py'

          $text = [System.IO.File]::ReadAllText($bootstrapPy)

          $oldDefault = '            ("msvc2022", "cl"),'
          $newDefault = '            (None, "gcc"),'

          $count = [regex]::Matches(
            $text,
            [regex]::Escape($oldDefault)
          ).Count

          if ($count -ne 1) {
            throw "Craft compiler-default layout changed; expected one MSVC default, found $count."
          }

          $text = $text.Replace(
            $oldDefault,
            $newDefault
          )

          [System.IO.File]::WriteAllText(
            $bootstrapPy,
            $text,
            [System.Text.UTF8Encoding]::new($false)
          )

          python $bootstrapPy `
            --prefix $env:SDK_ROOT `
            --localDev $bootstrap `
            --use-defaults

          $settingsPath = Join-Path `
            $env:SDK_ROOT `
            'etc\CraftSettings.ini'

          $settings = [System.IO.File]::ReadAllText(
            $settingsPath
          )

          if (
            $settings -notmatch
            '(?m)^\s*ABI\s*=\s*windows-gcc-x86_64\s*$'
          ) {
            throw "Craft was not bootstrapped as windows-gcc-x86_64."
          }

          Write-Host 'Craft MinGW bootstrap complete.'

      - name: Install Kdenlive dependencies only
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $craft = Join-Path `
            $env:SDK_ROOT `
            'craft\bin\craft.py'

          # IMPORTANT:
          #
          # --install-deps builds/installs Kdenlive's dependencies,
          # but deliberately does NOT build Kdenlive itself.
          #
          # Craft will use KDE's binary cache when a compatible binary
          # exists and only compile a dependency if no cached build exists.

          python $craft `
            --ci-mode `
            --options '[CodeSigning]Enabled=False' `
            --options 'kdenlive.version=master' `
            --install-deps `
            kdenlive

          # Make sure the SDK includes the build tools we will use
          # locally and in the validation job.

          python $craft `
            --ci-mode `
            cmake `
            ninja

          # Enter Craft's own environment.
          # This ensures we use the MinGW toolchain installed by Craft,
          # not an unrelated compiler preinstalled on the runner.

          . "$env:SDK_ROOT\craft\craftenv.ps1"

          foreach ($tool in @(
            'gcc',
            'g++',
            'cmake',
            'ninja'
          )) {
            $cmd = Get-Command `
              $tool `
              -ErrorAction Stop

            Write-Host "$tool -> $($cmd.Source)"
          }

          gcc --version
          g++ --version
          cmake --version
          ninja --version

      - name: Record SDK manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $craft = Join-Path `
            $env:SDK_ROOT `
            'craft\bin\craft.py'

          python $craft `
            --ci-mode `
            --print-installed |
            Set-Content `
              "$env:SDK_ROOT\installed-packages.txt" `
              -Encoding utf8

          @{
            abi = 'windows-gcc-x86_64'
            craftCommit = $env:CRAFT_BOOTSTRAP_REF
            kdenliveCommit = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            runId = $env:GITHUB_RUN_ID
            createdUtc = [DateTime]::UtcNow.ToString('o')
          } |
            ConvertTo-Json |
            Set-Content `
              "$env:SDK_ROOT\sdk-manifest.json" `
              -Encoding utf8

      - name: Remove non-SDK build and download caches
        run: |
          $ErrorActionPreference = 'Stop'

          # These directories are useful while Craft is producing
          # the dependency environment, but they are not necessary
          # for compiling Kdenlive against the finished SDK.

          foreach ($name in @(
            'build',
            'download',
            'tmp'
          )) {
            $path = Join-Path `
              $env:SDK_ROOT `
              $name

            if (Test-Path $path) {
              Write-Host "Removing $path"

              Remove-Item `
                $path `
                -Recurse `
                -Force
            }
          }

          foreach ($required in @(
            'bin',
            'include',
            'lib',
            'share',
            'dev-utils',
            'craft',
            'etc',
            'sdk-manifest.json',
            'installed-packages.txt'
          )) {
            $path = Join-Path `
              $env:SDK_ROOT `
              $required

            if (-not (Test-Path $path)) {
              throw "SDK is missing required path: $required"
            }
          }

      - name: Create SDK archive
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $archive = Join-Path `
            $env:RUNNER_TEMP `
            'kdenlive-deps-mingw-x64.7z'

          & 'C:\Program Files\7-Zip\7z.exe' `
            a `
            -t7z `
            -mx=3 `
            $archive `
            $env:SDK_ROOT

          if (-not (Test-Path $archive)) {
            throw 'SDK archive was not created.'
          }

          (Get-FileHash `
            $archive `
            -Algorithm SHA256
          ).Hash |
            Set-Content `
              "$archive.sha256" `
              -Encoding ascii

      - name: Upload MinGW dependency SDK
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-deps-mingw-x64

          path: |
            ${{ runner.temp }}/kdenlive-deps-mingw-x64.7z
            ${{ runner.temp }}/kdenlive-deps-mingw-x64.7z.sha256

          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  validate:
    name: Validate SDK with this Kdenlive fork
    needs: sdk

    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout Kdenlive fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download dependency SDK
        uses: actions/download-artifact@v4
        with:
          name: kdenlive-deps-mingw-x64
          path: sdk-download

      - name: Extract dependency SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $archive = Join-Path `
            $env:GITHUB_WORKSPACE `
            'sdk-download\kdenlive-deps-mingw-x64.7z'

          $checksum = "$archive.sha256"

          $expected = (
            Get-Content `
              $checksum `
              -Raw
          ).Trim()

          $actual = (
            Get-FileHash `
              $archive `
              -Algorithm SHA256
          ).Hash

          if ($actual -ne $expected) {
            throw "SDK checksum mismatch. Expected $expected, got $actual."
          }

          if (Test-Path $env:SDK_ROOT) {
            throw "Validation runner is not clean: $env:SDK_ROOT already exists."
          }

          & 'C:\Program Files\7-Zip\7z.exe' `
            x `
            $archive `
            '-oC:\' `
            -y

          if (
            -not (
              Test-Path "$env:SDK_ROOT\sdk-manifest.json"
            )
          ) {
            throw 'SDK extraction failed.'
          }

      - name: Configure Kdenlive against prebuilt SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          . "$env:SDK_ROOT\craft\craftenv.ps1"

          $gcc = (
            Get-Command `
              gcc `
              -ErrorAction Stop
          ).Source

          $gxx = (
            Get-Command `
              g++ `
              -ErrorAction Stop
          ).Source

          $cmake = (
            Get-Command `
              cmake `
              -ErrorAction Stop
          ).Source

          $ninja = (
            Get-Command `
              ninja `
              -ErrorAction Stop
          ).Source

          Write-Host "gcc   = $gcc"
          Write-Host "g++   = $gxx"
          Write-Host "cmake = $cmake"
          Write-Host "ninja = $ninja"

          $manifest = Get-Content `
            "$env:SDK_ROOT\sdk-manifest.json" `
            -Raw |
            ConvertFrom-Json

          if (
            $manifest.abi -ne
            'windows-gcc-x86_64'
          ) {
            throw "Wrong SDK ABI: $($manifest.abi)"
          }

          cmake `
            -S "$env:GITHUB_WORKSPACE" `
            -B C:/kd-build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER="$gcc" `
            -DCMAKE_CXX_COMPILER="$gxx" `
            -DCMAKE_PREFIX_PATH="$env:SDK_ROOT" `
            -DCMAKE_FIND_ROOT_PATH="$env:SDK_ROOT" `
            -DBUILD_TESTING=OFF `
            -DRELEASE_BUILD=OFF `
            -DUSE_DBUS=OFF `
            -DFETCH_OTIO=OFF

      - name: Compile Kdenlive only
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          . "$env:SDK_ROOT\craft\craftenv.ps1"

          # This step builds only this Kdenlive source checkout.
          #
          # Qt, KF6, FFmpeg, MLT, Frei0r, KDDockWidgets,
          # OpenTimelineIO, etc. are already inside the SDK.

          cmake `
            --build C:/kd-build `
            --parallel 2

          $exe = Get-ChildItem `
            C:/kd-build `
            -Recurse `
            -Filter kdenlive.exe `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            throw 'Kdenlive executable was not produced.'
          }

          Write-Host "Built Kdenlive: $($exe.FullName)"

          @"
          ## MinGW dependency SDK validation passed

          - ABI: windows-gcc-x86_64
          - Dependencies came from the downloaded SDK.
          - This repository was configured and compiled on a clean runner.
          - Artifact: kdenlive-deps-mingw-x64
          - The dependency artifact is retained for 30 days.
          "@ >> $env:GITHUB_STEP_SUMMARY
